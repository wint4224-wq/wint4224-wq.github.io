<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>재인증 결과</title>
<!-- 재인증(oauth-callback) 결과 화면. 함수가 ?s=ok|err&p=&d=&c= 로 리다이렉트해 온다.
     원본: perfect 레포 web/oauth/index.html -->
<style>
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  max-width:480px;margin:0 auto;padding:48px 20px;background:#fff;color:#15171a}
@media(prefers-color-scheme:dark){body{background:#0f1115;color:#e8eaed}}
.icon{font-size:44px}h1{font-size:19px;margin:14px 0 8px}
p{color:#6b7280;margin:0}
</style>
</head>
<body>
<div class="icon" id="icon">…</div>
<h1 id="title">확인 중…</h1>
<p id="detail"></p>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var NAMES = { kakao: '카카오', threads: 'Threads' };
  var ERRORS = {
    no_secret: ['설정 누락', 'JOB_SECRET 이 설정되지 않아 재인증을 진행할 수 없습니다.'],
    bad_request: ['잘못된 요청', '링크를 다시 확인해 주세요.'],
    cancelled: ['인증이 취소되었습니다', '다시 하려면 카톡 알림의 재인증 링크를 다시 눌러 주세요.'],
    bad_state: ['인증 검증 실패', '링크가 만료되었거나 올바르지 않습니다. 재인증 링크를 다시 눌러 주세요.'],
    failed: ['인증 처리 실패', '토큰을 받거나 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.']
  };
  var icon = document.getElementById('icon');
  var title = document.getElementById('title');
  var detail = document.getElementById('detail');
  var name = NAMES[q.get('p')] || '';

  if (q.get('s') === 'ok') {
    var d = parseInt(q.get('d') || '', 10);
    icon.textContent = '✅';
    title.textContent = (name ? name + ' ' : '') + '재인증 완료';
    detail.textContent = (d > 0 && d < 1000 ? '약 ' + d + '일간 유효합니다. ' : '') + '이 창을 닫으셔도 됩니다.';
  } else {
    var e = ERRORS[q.get('c')] || ['알 수 없는 결과', '재인증 링크를 다시 눌러 주세요.'];
    icon.textContent = '⚠️';
    title.textContent = e[0];
    detail.textContent = e[1];
  }
})();
</script>
</body>
</html>
